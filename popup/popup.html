<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipNote</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">
          <div class="title">ClipNote</div>
        </div>
      </header>

      <div class="toggle-section">
        <div class="toggle-label">Enable on YouTube, Udemy, ChatGPT &amp; Universal</div>
        <button id="toggleBtn" class="toggle-switch" aria-label="Toggle ClipNote">
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-state">OFF</span>
        </button>
      </div>

      <div class="hint">
        The note panel appears when you enable ClipNote on a supported video - YouTube and Udemy, ChatGPT, or any regular webpage.
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
